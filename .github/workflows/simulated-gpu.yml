name: Tests on simulated GPUs

# GitHub's runners have no GPU, so cmake-run-cuda.yml and cmake-run-hip.yml
# build the tests but run only the host ones (~[GPU]). PantheonSim simulates
# the GPUs on the runner's CPU, so the tests that launch kernels run here too.
# It checks results, not speed; a real GPU is still the final word.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]

# These jobs read the repository and nothing else. The simulator's action
# uses no token or secrets, and installs packages only from Ubuntu, NVIDIA
# and AMD.
permissions:
  contents: read

jobs:
  cuda:
    name: CUDA tests on a simulated A100
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'true'

    - name: Simulated GPU (NVIDIA A100) and CUDA 12.8
      uses: pantheongpu/pantheonsim@5a7ed5100c2d21d67a360872600df5ae8e8bb4bf # main, rehearsal
      with:
        gpu: nvidia/a100
        cuda-toolkit: '12.8'

    # The simulator stands in for the CUDA runtime at run time, so the tests
    # link the shared one; 80 carries PTX for the simulated A100.
    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CUDA_ARCHITECTURES=80 -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared
        -DKERNEL_FLOAT_BUILD_TEST=1 -DKERNEL_FLOAT_BUILD_EXAMPLE=1

    - name: Build
      run: cmake --build ${{github.workspace}}/build --parallel

    - name: Test, including the GPU tests
      working-directory: ${{github.workspace}}/build
      run: ./tests/kernel_float_tests --durations=yes --verbosity=high

  hip:
    name: HIP tests on a simulated MI300X
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'true'

    - name: Simulated GPU (AMD MI300X) and ROCm 7.1
      uses: pantheongpu/pantheonsim@5a7ed5100c2d21d67a360872600df5ae8e8bb4bf # main, rehearsal
      with:
        gpu: amd/mi300x
        rocm: '7.1'
        cuda-toolkit: none

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Debug
        -DKERNEL_FLOAT_BUILD_TEST=1 -DKERNEL_FLOAT_BUILD_EXAMPLE=1
        -DKERNEL_FLOAT_LANGUAGE=HIP -DCMAKE_HIP_ARCHITECTURES=gfx942

    - name: Build
      run: cmake --build ${{github.workspace}}/build --parallel

    - name: Test, including the GPU tests
      working-directory: ${{github.workspace}}/build
      run: ./tests/kernel_float_tests --durations=yes --verbosity=high
